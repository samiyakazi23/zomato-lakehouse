# =====================================================================
#  Zomato Real-Time Lakehouse
#  Kafka -> Spark Structured Streaming -> Delta Lake on S3 (SeaweedFS)
#        -> Postgres (serving) -> dbt -> Grafana
#  Orchestrated by Apache Airflow.
#
#  Start everything:   docker compose up -d --build
# =====================================================================

x-spark-image: &spark-image
  build:
    context: .
    dockerfile: docker/spark/Dockerfile
  image: zomato/spark:3.5.1
  env_file: .env
  volumes:
    - ./spark/jobs:/opt/jobs:ro
  restart: unless-stopped

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  image: zomato/airflow:2.9.3
  env_file: .env
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__PARALLELISM: "8"
    AIRFLOW__WEBSERVER__SECRET_KEY: zomato-lakehouse-secret
    AIRFLOW__WEBSERVER__WORKERS: "2"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "30"
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
    SPARK_CORES_MAX: "2"
    SPARK_DRIVER_MEMORY: 1g
    SPARK_EXECUTOR_MEMORY: 1g
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./spark/jobs:/opt/jobs:ro
    - ./dbt:/opt/dbt:ro
    - airflow-logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy

services:
  # ------------------------------------------------------------------ storage
  postgres:
    image: postgres:16-alpine
    container_name: zomato-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h localhost -d zomato"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # S3-compatible object store for the Delta Lake (SeaweedFS; MinIO no longer publishes free images)
  s3:
    image: chrislusf/seaweedfs:4.47
    container_name: zomato-s3
    hostname: s3
    command: server -dir=/data -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=1024 -volume.max=0
    ports:
      - "9000:9000"   # S3 API
      - "8888:8888"   # file browser: http://localhost:8888/buckets/lakehouse/
    volumes:
      - ./storage/s3.json:/etc/seaweedfs/s3.json:ro
      - s3-data:/data
    restart: unless-stopped

  # Creates the lakehouse bucket once the store answers (retries until it does)
  s3-init:
    image: amazon/aws-cli:2.15.0
    container_name: zomato-s3-init
    depends_on:
      - s3
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_DEFAULT_REGION: us-east-1
      BUCKET: ${LAKEHOUSE_BUCKET}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for i in $$(seq 1 60); do
          if aws --endpoint-url http://s3:9000 s3api head-bucket --bucket "$$BUCKET" 2>/dev/null \
             || aws --endpoint-url http://s3:9000 s3 mb "s3://$$BUCKET"; then
            echo "bucket $$BUCKET ready"; exit 0
          fi
          echo "waiting for the object store ($$i)"; sleep 3
        done
        echo "object store did not come up"; exit 1
    restart: "no"

  # ------------------------------------------------------------------ streaming
  kafka:
    image: apache/kafka:3.7.1
    container_name: zomato-kafka
    hostname: kafka
    ports:
      - "29092:29092"
    environment:
      CLUSTER_ID: zomato-kraft-cluster-0001
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 12
      KAFKA_LOG_RETENTION_BYTES: 1073741824
      KAFKA_MESSAGE_MAX_BYTES: 2097152
      KAFKA_HEAP_OPTS: -Xmx1G -Xms1G
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: zomato-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: zomato
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    restart: unless-stopped

  generator:
    build:
      context: .
      dockerfile: docker/generator/Dockerfile
    image: zomato/generator:1.0
    container_name: zomato-generator
    env_file: .env
    environment:
      ORDERS_PER_SEC: ${ORDERS_PER_SEC:-50}   # `ORDERS_PER_SEC=500 docker compose up -d generator` overrides
      GENERATOR_PROCESSES: ${GENERATOR_PROCESSES:-1}
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ------------------------------------------------------------------ spark cluster
  spark-master:
    <<: *spark-image
    container_name: zomato-spark-master
    hostname: spark-master
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
      --host spark-master --port 7077 --webui-port 8080
    environment:
      SPARK_DAEMON_MEMORY: 512m
    ports:
      - "9090:8080"
      - "7077:7077"

  spark-worker-1:
    <<: *spark-image
    container_name: zomato-spark-worker-1
    hostname: spark-worker-1
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077 --webui-port 8081
    environment: &worker-env
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: 1536m
      SPARK_DAEMON_MEMORY: 512m
      SPARK_WORKER_DIR: /tmp/spark-work
    depends_on:
      - spark-master
    ports:
      - "8081:8081"

  spark-worker-2:
    <<: *spark-image
    container_name: zomato-spark-worker-2
    hostname: spark-worker-2
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077 --webui-port 8081
    environment: *worker-env
    depends_on:
      - spark-master
    ports:
      - "8082:8081"

  # Long-running Spark Structured Streaming application (driver)
  spark-streaming:
    <<: *spark-image
    container_name: zomato-spark-streaming
    hostname: spark-streaming
    command: bash /opt/jobs/submit.sh streaming_pipeline.py
    environment:
      SPARK_CORES_MAX: "2"
      SPARK_DRIVER_MEMORY: 1g
      SPARK_EXECUTOR_MEMORY: 1g
    depends_on:
      spark-master:
        condition: service_started
      spark-worker-1:
        condition: service_started
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
    ports:
      - "4040:4040"

  # ------------------------------------------------------------------ orchestration
  airflow-init:
    <<: *airflow-common
    container_name: zomato-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true
        airflow pools set spark_pool 1 "Serialises Spark batch jobs so they never starve the streaming app"
        echo "airflow initialised"
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: zomato-airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    container_name: zomato-airflow-scheduler
    hostname: airflow-scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      s3-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # ------------------------------------------------------------------ visualisation
  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    image: zomato/web:1.0
    container_name: zomato-web
    env_file: .env
    environment:
      WEB_PG_USER: grafana        # read-only login
      WEB_PG_PASSWORD: grafana
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    container_name: zomato-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/zomato_realtime.json
      GF_USERS_DEFAULT_THEME: dark
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg-data:
  s3-data:
  airflow-logs:
  grafana-data:
